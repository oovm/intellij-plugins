# IntelliJ Platform Artifacts Repositories
# -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

# Maven-local library coordinates (Gradle modules under projects/packages)
libraryGroup=language.fluent
libraryVersion=0.4.7

# https://youtrack.jetbrains.com/articles/IDEA-A-2100662347/IntelliJ-IDEA-2025.1-Latest-Builds
platformVersion=2026.1
pluginSinceBuild=261

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
platformPlugins=com.github.voml.neo_theme:0.5.0,PsiViewer:253.7181
platformBundledPlugins=com.intellij.java,com.intellij.modules.ultimate,com.intellij.modules.json,org.toml.lang,org.intellij.plugins.markdown

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion=9.7.1
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx12G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=./heap-dump.hprof

# Mirror-friendly IntelliJ Platform Gradle Plugin settings
org.jetbrains.intellij.platform.useCacheRedirector=true
org.jetbrains.intellij.platform.selfUpdateCheck=false
org.jetbrains.intellij.platform.verifyPluginDefaultRecommendedIdes=false
org.jetbrains.intellij.platform.intellijPlatformIdesCacheEnabled=false
org.jetbrains.intellij.platform.productsReleasesJetBrainsIdesUrl=file:gradle/jetbrains-updates.xml
org.jetbrains.intellij.platform.productsReleasesAndroidStudioUrl=file:gradle/jetbrains-updates.xml

# Do not bundle Kotlin stdlib into the plugin artifact (provided by the IDE).
kotlin.stdlib.default.dependency=false
kotlin.daemon.jvmargs=-Xmx8G

# Plugin repository URL
pluginRepositoryUrl=https://github.com/oovm/intellij-plugins
